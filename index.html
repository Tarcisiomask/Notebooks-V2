<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Notebooks - Arquitetura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #F9FAFB; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="text-gray-800 h-screen flex overflow-hidden">

    <!-- Sidebar / Menu -->
    <aside class="w-80 bg-white border-r border-gray-200 flex flex-col h-full z-10">
        <div class="p-6 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">ArchBook Hub</h1>
            <p class="text-sm text-gray-500 mt-1">Guia de escolha para Arquitetura</p>
        </div>
        <div class="p-4 flex gap-2 border-b border-gray-200 bg-gray-50">
            <button onclick="setMode('list')" id="btn-list" class="flex-1 py-2 text-sm font-semibold rounded-md bg-white border shadow-sm text-blue-600">Catálogo</button>
            <button onclick="setMode('compare')" id="btn-compare" class="flex-1 py-2 text-sm font-semibold rounded-md hover:bg-gray-100 text-gray-600">Comparar (2)</button>
        </div>
        <div class="flex-1 overflow-y-auto p-4" id="laptop-list">
            <!-- Injetado via JS -->
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 h-full overflow-y-auto bg-gray-50 relative" id="main-content">
        <!-- Injetado via JS -->
    </main>

    <script src="dados.js"></script>
    <script>
        let currentMode = 'list'; // 'list' or 'compare'
        let selectedLaptopId = notebooks[0].id;
        let compareIds = [notebooks[0].id, notebooks[1].id];

        function renderSidebar() {
            const container = document.getElementById('laptop-list');
            container.innerHTML = '';
            
            notebooks.forEach(nb => {
                const isSelected = currentMode === 'list' ? nb.id === selectedLaptopId : compareIds.includes(nb.id);
                const baseClasses = "mb-3 p-4 rounded-xl cursor-pointer border card-hover text-left w-full transition-colors";
                const colorClasses = isSelected ? "bg-blue-50 border-blue-200 shadow-sm" : "bg-white border-gray-200 hover:border-blue-300";
                
                const btn = document.createElement('button');
                btn.className = `${baseClasses} ${colorClasses}`;
                btn.onclick = () => handleSelect(nb.id);
                
                btn.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h3 class="font-bold text-gray-900 leading-tight">${nb.marca} ${nb.modelo}</h3>
                        ${currentMode === 'compare' ? `<div class="h-4 w-4 rounded border flex items-center justify-center ${isSelected ? 'bg-blue-500 border-blue-500' : 'border-gray-300'}"><i data-lucide="check" class="text-white h-3 w-3 ${isSelected ? 'block' : 'hidden'}"></i></div>` : ''}
                    </div>
                    <p class="text-xs text-gray-500 mt-1">${nb.processadorResumo} • RTX ${nb.gpuModel}</p>
                    <div class="mt-3 flex items-center justify-between">
                        <span class="text-sm font-semibold text-gray-900">${nb.precoMedio}</span>
                        <span class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-600">${nb.peso}</span>
                    </div>
                `;
                container.appendChild(btn);
            });
            lucide.createIcons();
        }

        function handleSelect(id) {
            if (currentMode === 'list') {
                selectedLaptopId = id;
            } else {
                if (compareIds.includes(id)) {
                    compareIds = compareIds.filter(cid => cid !== id);
                } else {
                    if (compareIds.length >= 2) compareIds.shift();
                    compareIds.push(id);
                }
            }
            renderSidebar();
            renderMain();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-list').className = `flex-1 py-2 text-sm font-semibold rounded-md ${mode === 'list' ? 'bg-white border shadow-sm text-blue-600' : 'hover:bg-gray-200 text-gray-600'}`;
            document.getElementById('btn-compare').className = `flex-1 py-2 text-sm font-semibold rounded-md ${mode === 'compare' ? 'bg-white border shadow-sm text-blue-600' : 'hover:bg-gray-200 text-gray-600'}`;
            renderSidebar();
            renderMain();
        }

        function getSpecsHtml(nb) {
            return `
                <div class="grid grid-cols-2 gap-4 mt-6">
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-100">
                        <div class="flex items-center gap-2 text-gray-500 mb-1"><i data-lucide="cpu" class="w-4 h-4"></i><span class="text-xs font-semibold uppercase tracking-wider">Processador</span></div>
                        <p class="font-medium text-sm text-gray-900">${nb.specs.cpu}</p>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-100">
                        <div class="flex items-center gap-2 text-gray-500 mb-1"><i data-lucide="monitor-play" class="w-4 h-4"></i><span class="text-xs font-semibold uppercase tracking-wider">Placa de Vídeo (TGP)</span></div>
                        <p class="font-medium text-sm text-gray-900">${nb.specs.gpu}</p>
                        <p class="text-xs ${nb.specs.tgpBaixo ? 'text-red-500 font-medium mt-1' : 'text-green-600 mt-1'}">TGP: ${nb.specs.tgp}</p>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-100">
                        <div class="flex items-center gap-2 text-gray-500 mb-1"><i data-lucide="monitor" class="w-4 h-4"></i><span class="text-xs font-semibold uppercase tracking-wider">Tela</span></div>
                        <p class="font-medium text-sm text-gray-900">${nb.specs.tela}</p>
                        <p class="text-xs mt-1 ${nb.specs.telaRuim ? 'text-red-500 font-medium' : 'text-green-600'}">${nb.specs.telaCores} • ${nb.specs.brilho}</p>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-100">
                        <div class="flex items-center gap-2 text-gray-500 mb-1"><i data-lucide="memory-stick" class="w-4 h-4"></i><span class="text-xs font-semibold uppercase tracking-wider">Memória e Slot</span></div>
                        <p class="font-medium text-sm text-gray-900">${nb.specs.ram}</p>
                        <p class="text-xs text-gray-500 mt-1">Expansível: ${nb.specs.expansivel}</p>
                    </div>
                </div>
            `;
        }

        function renderDetailView(nb) {
            return `
                <div class="max-w-4xl mx-auto p-8 pt-12 pb-24">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        
                        <!-- Header / Imagem -->
                        <div class="bg-gray-100 w-full h-64 flex items-center justify-center relative border-b border-gray-200">
                            ${nb.imagemUrl 
                                ? `<img src="${nb.imagemUrl}" alt="${nb.modelo}" class="object-contain h-56 mix-blend-multiply">` 
                                : `<div class="text-gray-400 flex flex-col items-center"><i data-lucide="laptop" class="w-16 h-16 mb-2"></i><span>Sem Imagem</span></div>`
                            }
                            <div class="absolute top-4 right-4 bg-white px-3 py-1 rounded-full shadow-sm text-sm font-bold text-gray-800">
                                ${nb.precoMedio}
                            </div>
                        </div>

                        <!-- Info -->
                        <div class="p-8">
                            <h2 class="text-3xl font-extrabold text-gray-900">${nb.marca} ${nb.modelo}</h2>
                            <p class="text-gray-500 text-lg mt-2">${nb.descricao}</p>
                            
                            ${getSpecsHtml(nb)}

                            <div class="grid grid-cols-2 gap-8 mt-10">
                                <div>
                                    <h4 class="flex items-center gap-2 font-bold text-green-700 mb-4"><i data-lucide="check-circle-2"></i> Por que comprar? (Prós)</h4>
                                    <ul class="space-y-2">
                                        ${nb.pros.map(pro => `<li class="flex items-start gap-2 text-sm text-gray-700"><div class="mt-1 w-1.5 h-1.5 rounded-full bg-green-500 shrink-0"></div>${pro}</li>`).join('')}
                                    </ul>
                                </div>
                                <div>
                                    <h4 class="flex items-center gap-2 font-bold text-orange-600 mb-4"><i data-lucide="alert-triangle"></i> Atenção (Contras)</h4>
                                    <ul class="space-y-2">
                                        ${nb.contras.map(con => `<li class="flex items-start gap-2 text-sm text-gray-700"><div class="mt-1 w-1.5 h-1.5 rounded-full bg-orange-400 shrink-0"></div>${con}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>

                            <div class="mt-10 bg-red-50 border-l-4 border-red-500 p-5 rounded-r-lg">
                                <h4 class="font-bold text-red-800 flex items-center gap-2"><i data-lucide="flame" class="w-5 h-5"></i> Red Flags / Alertas</h4>
                                <p class="text-sm text-red-700 mt-2">${nb.redFlags}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCompareView() {
            if (compareIds.length === 0) return `<div class="flex h-full items-center justify-center text-gray-400">Selecione notebooks para comparar.</div>`;
            
            const nbs = compareIds.map(id => notebooks.find(n => n.id === id));
            
            let cols = nbs.map(nb => `
                <div class="flex-1 bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-gray-50">
                        <h3 class="text-xl font-bold text-gray-900">${nb.marca} ${nb.modelo}</h3>
                        <p class="text-lg font-semibold text-blue-600 mt-1">${nb.precoMedio}</p>
                    </div>
                    <div class="p-6">
                        ${getSpecsHtml(nb)}
                        
                        <div class="mt-8 space-y-4">
                            <div>
                                <h5 class="text-xs font-bold uppercase text-green-600 mb-2">Vantagens</h5>
                                <ul class="text-sm text-gray-700 space-y-1">
                                    ${nb.pros.map(p => `<li>• ${p}</li>`).join('')}
                                </ul>
                            </div>
                            <div>
                                <h5 class="text-xs font-bold uppercase text-red-500 mb-2">Problemas</h5>
                                <ul class="text-sm text-gray-700 space-y-1">
                                    ${nb.redFlags}
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            return `
                <div class="p-8 pt-12 h-full">
                    <h2 class="text-2xl font-bold text-gray-900 mb-8">Comparativo Lado a Lado</h2>
                    <div class="flex gap-6">
                        ${cols}
                    </div>
                </div>
            `;
        }

        function renderMain() {
            const main = document.getElementById('main-content');
            if (currentMode === 'list') {
                const nb = notebooks.find(n => n.id === selectedLaptopId);
                main.innerHTML = renderDetailView(nb);
            } else {
                main.innerHTML = renderCompareView();
            }
            lucide.createIcons();
        }

        // Init
        renderSidebar();
        renderMain();
    </script>
</body>
</html>
